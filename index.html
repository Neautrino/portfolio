<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      Favicons. `sizes="32x32"` on the .ico is deliberate: without it Chrome
      may download both and prefer the raster over the SVG. The .ico also
      answers bare GET /favicon.ico from scrapers and feeds Google Search,
      which does not consume SVG.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0f2fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161620" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subhendu Singh | Software Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300..900;1,300..900&family=Inter:wght@300..700&family=Geist+Mono:wght@300..600&display=swap"
      rel="stylesheet"
    />
    <!--
      Cloudflare Web Analytics (real unique-visitor tracking, no cookies).
      Token comes from VITE_CF_BEACON_TOKEN (see .env.example) so it's
      never hardcoded in source. Empty/unset -> Cloudflare's beacon script
      no-ops silently, so this stays inert until the env var is set.
      1. Deploy this site to Cloudflare Workers/Pages first (needs a live domain).
      2. Dashboard -> your project -> Analytics -> Web Analytics -> Enable.
      3. Set VITE_CF_BEACON_TOKEN in your deploy environment (and/or local .env).
    -->
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "%VITE_CF_BEACON_TOKEN%"}'
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
